<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Matching Game</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
         background: linear-gradient(180deg, #0d1442 0%, #1b2560 60%, #2a3578 100%);
         color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
            background: rgba(13,20,66,.85); border-bottom: 1px solid rgba(255,255,255,.12); }
  .topbar a.back { color: #9fd8ff; text-decoration: none; font-weight: 700; white-space: nowrap; }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  .wrap { max-width: 760px; width: 100%; margin: 0 auto; padding: 20px 16px 48px; }
  .hud { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .pill { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
          padding: 8px 16px; font-size: 15px; font-weight: 600; }
  .pill b { color: #ffcf40; }
  #restart { margin-left: auto; border: 0; border-radius: 999px; background: rgba(255,255,255,.14);
             color: #fff; font-weight: 700; font-size: 15px; padding: 9px 18px; cursor: pointer; }
  .hint { color: #c9d4f5; font-size: 15px; margin: 6px 0 16px; }
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 480px) { .board { gap: 8px; } }
  .card { aspect-ratio: 1 / 1; perspective: 800px; cursor: pointer; }
  .card .inner { position: relative; width: 100%; height: 100%;
                 transform-style: preserve-3d; transition: transform .45s; }
  .card.open .inner, .card.done .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          border-radius: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .front { background: linear-gradient(135deg, #2b3a8f, #4a5fc1); color: #fff; font-size: 44px;
           box-shadow: 0 6px 16px rgba(0,0,0,.35); border: 2px solid rgba(255,255,255,.25); }
  .card.done .front { visibility: hidden; }
  .back { background: #fff; transform: rotateY(180deg); padding: 6px; }
  .back img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .card.done .back { outline: 3px solid #58cc02; outline-offset: -3px; animation: pop .35s ease; }
  @keyframes pop { 0% { transform: rotateY(180deg) scale(1); }
                   50% { transform: rotateY(180deg) scale(1.08); }
                   100% { transform: rotateY(180deg) scale(1); } }
  .win { position: fixed; inset: 0; background: rgba(13,20,66,.70); display: flex;
         align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .win[hidden] { display: none; }
  .win .box { background: #fff; border-radius: 24px; padding: 36px 32px; text-align: center;
              max-width: 380px; width: 100%; box-shadow: 0 24px 64px rgba(0,0,0,.35); color: #17202e; }
  .win .trophy { font-size: 64px; }
  .win h2 { margin: 8px 0 4px; font-size: 26px; }
  .win .stars { font-size: 36px; margin: 6px 0; letter-spacing: 4px; }
  .win p { color: #5c6675; margin: 0 0 20px; }
  .rowbtns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .rowbtns button, .rowbtns a { border: 0; border-radius: 12px; padding: 14px 22px;
      font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; }
  #again { background: #58cc02; color: #fff; }
  #tolesson { background: #1cb0f6; color: #fff; }
  .rowbtns a.all { background: #eef1f6; color: #17202e; }
  footer { text-align: center; color: #8fa0c8; font-size: 13px; margin-top: 28px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../../">&larr; All lessons</a>
  <h1>&#x1F680; Space Matching Game</h1>
</div>
<div class="wrap">
  <div class="hud">
    <div class="pill">Moves <b id="moves">0</b></div>
    <div class="pill">&#9201; <b id="time">0:00</b></div>
    <div class="pill">&#11088; Pairs <b id="found">0/8</b></div>
    <button id="restart">&#8635; Restart</button>
  </div>
  <p class="hint">Flip two cards and match the pictures! Tap an open card to hear its name. &#x1F50A;</p>
  <div class="board" id="board"></div>
  <footer>Space Matching Game &mdash; from the Space for Pre-K lesson, made for Edwin&rsquo;s class.</footer>
</div>
<div class="win" id="win" hidden>
  <div class="box">
    <div class="trophy">&#x1F3C6;</div>
    <h2>You did it!</h2>
    <div class="stars" id="stars"></div>
    <p id="winStats"></p>
    <div class="rowbtns">
      <button id="again">PLAY AGAIN</button>
      <button id="tolesson">LESSON</button>
      <a class="all" href="../../">ALL LESSONS</a>
    </div>
  </div>
</div>
<script>
/* Same 8 pictures as the lesson — pictures match pictures, TTS says the name */
var IMG = "../../assets/img/space/";
var ITEMS = [
  { name: "astronaut", img: IMG + "astronaut.webp" },
  { name: "rocket",    img: IMG + "rocket.webp" },
  { name: "sun",       img: IMG + "sun.webp" },
  { name: "moon",      img: IMG + "moon.webp" },
  { name: "stars",     img: IMG + "stars.webp" },
  { name: "earth",     img: IMG + "earth.webp" },
  { name: "mars",      img: IMG + "mars.webp" },
  { name: "saturn",    img: IMG + "saturn.webp" }
];
var NPAIRS = ITEMS.length;
var BACKEMOJI = "&#x1F680;";

var board = document.getElementById("board");
var movesEl = document.getElementById("moves");
var timeEl = document.getElementById("time");
var foundEl = document.getElementById("found");
var winEl = document.getElementById("win");

var first = null, lock = false, moves = 0, found = 0, secs = 0, timer = null, started = false;

/* ---------- tiny synth ---------- */
var AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === "suspended") { AC.resume(); }
  return AC;
}
function tone(freq, dur, when, type) {
  var c = ac(); if (!c) return;
  when = when || 0; type = type || "sine";
  var o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  var t = c.currentTime + when;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function sndFlip() { tone(520, 0.07); }
function sndMatch() { tone(660, 0.12); tone(880, 0.16, 0.1); }
function sndNo() { tone(196, 0.18, 0, "triangle"); }
function sndWin() { var n = [523, 659, 784, 1047]; for (var i = 0; i < n.length; i++) tone(n[i], 0.22, i * 0.14); }

/* ---------- speech: TTS carries every word ---------- */
function speak(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- game ---------- */
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmt(s) { return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function startTimer() {
  if (started) return; started = true;
  timer = setInterval(function () { secs++; timeEl.textContent = fmt(secs); }, 1000);
}
function build() {
  var deck = [];
  ITEMS.forEach(function (w, i) {
    deck.push({ pair: i, name: w.name, html: "<img src='" + w.img + "' alt='' />" });
    deck.push({ pair: i, name: w.name, html: "<img src='" + w.img + "' alt='' />" });
  });
  deck = shuffle(deck);
  board.innerHTML = "";
  deck.forEach(function (c) {
    var d = document.createElement("div");
    d.className = "card";
    d.innerHTML = '<div class="inner"><div class="face front">' + BACKEMOJI +
      '</div><div class="face back">' + c.html + "</div></div>";
    d._pair = c.pair; d._name = c.name;
    d.addEventListener("click", function () { onFlip(d); });
    board.appendChild(d);
  });
  first = null; lock = false; moves = 0; found = 0; secs = 0; started = false;
  clearInterval(timer); timer = null;
  movesEl.textContent = "0"; timeEl.textContent = "0:00";
  foundEl.textContent = "0/" + NPAIRS;
  winEl.hidden = true;
}
function onFlip(card) {
  if (lock || card.classList.contains("open") || card.classList.contains("done")) {
    if (card.classList.contains("open") && !card.classList.contains("done")) speak(card._name);
    return;
  }
  startTimer();
  card.classList.add("open");
  sndFlip(); speak(card._name);
  if (!first) { first = card; return; }
  moves++; movesEl.textContent = moves;
  if (first._pair === card._pair) {
    lock = true;
    var a = first, b = card; first = null;
    setTimeout(function () {
      a.classList.add("done"); b.classList.add("done");
      sndMatch();
      found++; foundEl.textContent = found + "/" + NPAIRS;
      lock = false;
      if (found === NPAIRS) win();
    }, 450);
  } else {
    lock = true;
    var x = first, y = card; first = null;
    sndNo();
    setTimeout(function () {
      x.classList.remove("open"); y.classList.remove("open");
      lock = false;
    }, 950);
  }
}
function win() {
  clearInterval(timer);
  sndWin();
  speak("You did it! Great matching!");
  var stars = moves <= Math.ceil(NPAIRS * 1.6) ? 3 : (moves <= Math.ceil(NPAIRS * 2.4) ? 2 : 1);
  var s = "";
  for (var i = 0; i < 3; i++) s += i < stars ? "&#11088;" : "&#9734;";
  document.getElementById("stars").innerHTML = s;
  document.getElementById("winStats").textContent =
    NPAIRS + " pairs in " + moves + " moves, " + fmt(secs) + "!";
  setTimeout(function () { winEl.hidden = false; }, 500);
}
document.getElementById("restart").addEventListener("click", build);
document.getElementById("again").addEventListener("click", build);
document.getElementById("tolesson").addEventListener("click", function () { window.location.href = "../space-prek-day1/"; });
build();
</script>
</body>
</html>
