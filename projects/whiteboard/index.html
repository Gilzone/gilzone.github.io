<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Whiteboard — Edwin's Projects</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff;
         color: #17202e; height: 100dvh; overflow: hidden; }

  #stage { position: fixed; inset: 0; background: #fff; overflow: hidden; touch-action: none; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #stage.dragover #board { outline: 5px dashed #2b6bff; outline-offset: -5px; }

  /* ---- floating cards ---- */
  .fcard { position: absolute; z-index: 30; background: #fff; border-radius: 20px;
           box-shadow: 0 10px 32px rgba(23,32,46,.16); border: 1px solid rgba(230,233,240,.9); }

  #brandCard { top: 14px; left: 14px; display: flex; align-items: center; gap: 8px; padding: 8px 14px 8px 8px; }
  #brandCard a.back { color: #2b6bff; text-decoration: none; font-weight: 800; font-size: 15px;
                      padding: 10px 12px; border-radius: 12px; white-space: nowrap; }
  #brandCard a.back:hover { background: #eef2ff; }
  #boardTitle { border: 0; outline: none; font-size: 16px; font-weight: 700; color: #17202e;
                width: 170px; background: transparent; }
  #boardTitle:focus { background: #f6f8fc; border-radius: 8px; }

  #sysCard { top: 14px; right: 14px; display: flex; align-items: center; gap: 4px; padding: 8px; }
  .ibtn { border: 0; background: transparent; border-radius: 12px; width: 44px; height: 44px; font-size: 20px;
          cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #17202e; }
  .ibtn:hover { background: #eef2ff; }
  .ibtn:disabled { opacity: .3; }
  .ibtn.danger:hover { background: #fdecec; }

  /* ---- bottom main toolbar ---- */
  #mainbar { left: 50%; transform: translateX(-50%); bottom: 16px; display: flex; align-items: center;
             gap: 2px; padding: 8px 12px; }
  #mainbar .ibtn { width: 52px; height: 52px; font-size: 24px; border-radius: 14px; position: relative; }
  #mainbar .ibtn.on { background: #eaf0ff; box-shadow: inset 0 0 0 2px #2b6bff; }
  #mainbar .vsep { width: 1px; height: 34px; background: #e6e9f0; margin: 0 6px; }
  #pageBadge { position: absolute; top: 2px; right: 2px; background: #2b6bff; color: #fff; font-size: 11px;
               font-weight: 800; min-width: 20px; height: 20px; border-radius: 999px; display: flex;
               align-items: center; justify-content: center; padding: 0 5px; }

  /* ---- floating pen palette ---- */
  #penPalette { left: 50%; transform: translateX(-50%); bottom: 92px; padding: 12px 16px;
                display: flex; flex-direction: column; gap: 10px; }
  #penPalette[hidden] { display: none; }
  .prow { display: flex; align-items: center; gap: 6px; justify-content: center; }
  .ptool { border: 2px solid transparent; background: transparent; border-radius: 12px; width: 48px; height: 48px;
           font-size: 23px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .ptool:hover { background: #f0f4ff; }
  .ptool.on { background: #eaf0ff; border-color: #2b6bff; }
  .pdiv { width: 1px; align-self: stretch; background: #e6e9f0; margin: 2px 4px; }
  .hdiv { height: 1px; background: #eef0f5; margin: 0 -4px; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); padding: 0; }
  .swatch.on { border-color: #2b6bff; transform: scale(1.15); }
  .swrap { position: relative; width: 36px; height: 36px; }
  .swrap .swatch { width: 100%; height: 100%; font-size: 20px; display: flex; align-items: center; justify-content: center;
                   background: conic-gradient(#e5484d,#f5a524,#31a24c,#2b6bff,#9b5bff,#e5484d); }
  .swrap input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .thick { border: 0; background: transparent; border-radius: 12px; width: 48px; height: 40px; cursor: pointer;
           display: inline-flex; align-items: center; justify-content: center; }
  .thick:hover { background: #f0f4ff; }
  .thick.on { background: #eaf0ff; box-shadow: inset 0 0 0 2px #2b6bff; }
  .thick i { display: block; border-radius: 50%; background: #17202e; }

  /* ---- popups anchored above mainbar ---- */
  .popup { position: absolute; z-index: 31; left: 50%; transform: translateX(-50%); bottom: 92px;
           background: #fff; border-radius: 18px; box-shadow: 0 12px 36px rgba(23,32,46,.2);
           border: 1px solid rgba(230,233,240,.9); padding: 10px; display: flex; gap: 6px; }
  .popup[hidden] { display: none; }
  .popup .ibtn { width: 52px; height: 52px; font-size: 24px; border-radius: 14px; flex-direction: column; gap: 2px; }
  .popup .ibtn small { font-size: 10px; font-weight: 700; color: #5c6675; }
  .popup .ibtn.on { background: #eaf0ff; box-shadow: inset 0 0 0 2px #2b6bff; }
  .popup .ibtn.on small { color: #2b6bff; }
  #moreMenu { flex-direction: column; align-items: stretch; min-width: 230px; padding: 8px; }
  #moreMenu .mrow { display: flex; align-items: center; gap: 8px; }
  #moreMenu button.mi { display: flex; align-items: center; gap: 10px; border: 0; background: transparent;
                        border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
                        color: #17202e; text-align: left; width: 100%; }
  #moreMenu button.mi:hover { background: #f0f4ff; }
  #moreMenu button.mi.danger { color: #d33f3f; }
  #moreMenu .msep { height: 1px; background: #eef0f5; margin: 4px 2px; }
  #moreMenu .mlab { font-size: 12px; font-weight: 800; color: #8a93a5; text-transform: uppercase;
                    letter-spacing: .06em; padding: 8px 12px 2px; }
  .bgdots { display: flex; gap: 8px; padding: 4px 12px 10px; }
  .bgdot { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #e6e9f0; cursor: pointer; padding: 0; }
  .bgdot.on { border-color: #2b6bff; box-shadow: 0 0 0 2px rgba(43,107,255,.25); }
  #pagesPanel { flex-direction: column; min-width: 210px; max-height: 300px; overflow-y: auto; }
  #pagesPanel .pg { display: flex; align-items: center; gap: 10px; border: 0; background: transparent;
                    border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
                    color: #17202e; width: 100%; text-align: left; }
  #pagesPanel .pg:hover { background: #f0f4ff; }
  #pagesPanel .pg.on { background: #eaf0ff; color: #2b6bff; }
  #pagesPanel .pg .del { margin-left: auto; color: #d33f3f; font-size: 18px; padding: 4px 8px; border-radius: 8px; }
  #pagesPanel .pg .del:hover { background: #fdecec; }

  /* ---- text editor overlay ---- */
  #textEdit { position: absolute; z-index: 26; border: 2px dashed #2b6bff; border-radius: 10px;
              background: rgba(255,255,255,.94); padding: 8px; font-family: inherit; font-weight: 800;
              resize: none; overflow: hidden; outline: none; line-height: 1.25; }

  /* ---- image search drawer ---- */
  #imgDrawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(340px, 90%); background: #fff; z-index: 32;
               box-shadow: -10px 0 36px rgba(23,32,46,.2); transform: translateX(106%); transition: transform .22s ease;
               display: flex; flex-direction: column; border-radius: 20px 0 0 20px; }
  #imgDrawer.open { transform: translateX(0); }
  #imgDrawer .dhead { display: flex; align-items: center; gap: 8px; padding: 14px; border-bottom: 1px solid #eef0f5; }
  #imgDrawer .dhead b { font-size: 16px; flex: 1; }
  #imgSearch { display: flex; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #eef0f5; }
  #imgSearch input { flex: 1; min-width: 0; font-size: 16px; padding: 11px 12px; border: 1.5px solid #dfe3ec;
                     border-radius: 12px; outline: none; }
  #imgSearch input:focus { border-color: #2b6bff; }
  #imgSearch button { border: 0; border-radius: 12px; background: #2b6bff; color: #fff; font-weight: 700;
                      font-size: 15px; padding: 0 18px; cursor: pointer; }
  #imgResults { flex: 1; overflow-y: auto; padding: 12px 14px; display: grid; grid-template-columns: 1fr 1fr;
                gap: 10px; align-content: start; }
  .ires { border: 1px solid #e6e9f0; border-radius: 12px; overflow: hidden; cursor: pointer; background: #fff; }
  .ires:hover { border-color: #2b6bff; box-shadow: 0 4px 14px rgba(43,107,255,.18); }
  .ires img { width: 100%; height: 100px; object-fit: cover; display: block; background: #f6f8fc; }
  .ires .cap { padding: 6px 8px; }
  .ires .t { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ires .lic { font-size: 10.5px; color: #8a93a5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #imgNote { padding: 10px 14px; font-size: 11.5px; color: #8a93a5; border-top: 1px solid #eef0f5; line-height: 1.5; }
  .dmsg { grid-column: 1 / -1; text-align: center; color: #8a93a5; font-size: 14px; padding: 24px 8px; }

  /* ---- timer widgets ---- */
  .timer { position: absolute; z-index: 24; width: 228px; background: #fff; border-radius: 18px;
           box-shadow: 0 12px 34px rgba(23,32,46,.24); border: 1px solid rgba(230,233,240,.9); overflow: hidden;
           touch-action: none; user-select: none; -webkit-user-select: none; }
  .timer.done { animation: tflash .6s 6; border-color: #e5484d; }
  @keyframes tflash { 50% { box-shadow: 0 0 0 7px rgba(229,72,77,.45); } }
  .timer .thead { background: #2b6bff; color: #fff; font-weight: 700; font-size: 13px; padding: 9px 10px;
                  cursor: grab; display: flex; align-items: center; gap: 6px; }
  .timer .thead:active { cursor: grabbing; }
  .timer .thead .tt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .timer .thead .tx { cursor: pointer; font-size: 15px; padding: 2px 8px; border-radius: 8px; }
  .timer .thead .tx:hover { background: rgba(255,255,255,.25); }
  .timer .tbody { padding: 10px 12px 12px; }
  .timer .tdisp { font-size: 40px; font-weight: 800; text-align: center; letter-spacing: -0.02em;
                  font-variant-numeric: tabular-nums; }
  .timer .tbar { height: 9px; background: #eef0f5; border-radius: 999px; overflow: hidden; margin: 8px 0 10px; }
  .timer .tbar i { display: block; height: 100%; background: #2b6bff; border-radius: 999px; transition: width .2s linear; }
  .timer .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .timer .chip { flex: 1; border: 1.5px solid #e6e9f0; background: #fff; border-radius: 999px; font-size: 13px;
                 font-weight: 700; padding: 8px 0; cursor: pointer; min-width: 42px; }
  .timer .chip:hover { border-color: #2b6bff; color: #2b6bff; }
  .timer .tcustom { display: flex; gap: 6px; margin-bottom: 8px; }
  .timer .tcustom input { flex: 1; min-width: 0; font-size: 15px; padding: 9px 10px; border: 1.5px solid #dfe3ec;
                         border-radius: 10px; outline: none; }
  .timer .tcustom button { border: 0; border-radius: 10px; background: #eef2ff; color: #2b6bff; font-weight: 700;
                           padding: 0 14px; cursor: pointer; font-size: 14px; }
  .timer .tbtns { display: flex; gap: 6px; }
  .timer .tbtns button { flex: 1; border: 0; border-radius: 10px; font-size: 15px; font-weight: 700;
                         padding: 11px 0; cursor: pointer; }
  .timer .tstart { background: #2b6bff; color: #fff; }
  .timer .treset { background: #eef0f5; color: #17202e; }

  #status { position: absolute; left: 14px; bottom: 16px; background: rgba(23,32,46,.88); color: #fff; font-size: 13px;
            font-weight: 600; padding: 9px 15px; border-radius: 999px; pointer-events: none; opacity: 0;
            transition: opacity .25s; z-index: 28; max-width: 60%; }
  #status.show { opacity: 1; }

  [hidden] { display: none !important; }
  @media (max-width: 700px) {
    #boardTitle { width: 110px; }
    #mainbar .ibtn { width: 46px; height: 46px; font-size: 21px; }
    #penPalette { bottom: 86px; padding: 10px 12px; max-width: 94vw; }
    .prow { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="board"></canvas>

  <div id="brandCard" class="fcard">
    <a class="back" href="../../">← Lessons</a>
    <input id="boardTitle" value="Untitled board" maxlength="60" aria-label="Board title" />
  </div>

  <div id="sysCard" class="fcard">
    <button class="ibtn" id="bgBtn" title="Board background">▦</button>
    <button class="ibtn" id="exportBtn" title="Export board as PNG">⤵</button>
    <button class="ibtn danger" id="clearBtn" title="Clear board">🗑</button>
  </div>

  <!-- floating pen palette -->
  <div id="penPalette" class="fcard">
    <div class="prow" id="penTools">
      <button class="ptool on" data-pt="pen" title="Pen">✏️</button>
      <button class="ptool" data-pt="brush" title="Calligraphy brush">🖌️</button>
      <button class="ptool" data-pt="high" title="Highlighter">🖍️</button>
      <button class="ptool" data-pt="eraser" title="Eraser">🧽</button>
    </div>
    <div class="hdiv"></div>
    <div class="prow" id="penColors">
      <button class="swatch on" data-c="#17202e" style="background:#17202e" title="Black"></button>
      <button class="swatch" data-c="#e5484d" style="background:#e5484d" title="Red"></button>
      <button class="swatch" data-c="#2b6bff" style="background:#2b6bff" title="Blue"></button>
      <button class="swatch" data-c="#31a24c" style="background:#31a24c" title="Green"></button>
      <button class="swatch" data-c="#9b5bff" style="background:#9b5bff" title="Purple"></button>
      <span class="swrap" title="Custom color"><span class="swatch">🌈</span><input type="color" id="customColor" value="#f5a524" /></span>
    </div>
    <div class="hdiv"></div>
    <div class="prow" id="penThick">
      <button class="thick" data-s="0" title="Thin"><i style="width:8px;height:8px"></i></button>
      <button class="thick on" data-s="1" title="Medium"><i style="width:14px;height:14px"></i></button>
      <button class="thick" data-s="2" title="Thick"><i style="width:22px;height:22px"></i></button>
    </div>
  </div>

  <!-- bottom main toolbar -->
  <div id="mainbar" class="fcard">
    <button class="ibtn on" id="penBtn" title="Pen tools">✏️</button>
    <div class="vsep"></div>
    <button class="ibtn" id="appsBtn" title="More tools">⊞</button>
    <button class="ibtn" id="uploadBtn" title="Upload image from device">⤴</button>
    <button class="ibtn" id="shapesBtn" title="Select & shapes">△</button>
    <button class="ibtn" id="imageBtn" title="Search stock images">🖼️</button>
    <button class="ibtn" id="moreBtn" title="More">···</button>
    <div class="vsep"></div>
    <button class="ibtn" id="undoBtn" title="Undo">↩</button>
    <button class="ibtn" id="redoBtn" title="Redo">↪</button>
    <div class="vsep"></div>
    <button class="ibtn" id="pagesBtn" title="Pages">📄<span id="pageBadge">1</span></button>
    <button class="ibtn" id="addPageBtn" title="Add page">＋</button>
  </div>

  <!-- popups -->
  <div id="appsPanel" class="popup" hidden>
    <button class="ibtn" data-app="text" title="Text box">T<small>Text</small></button>
    <button class="ibtn" data-app="note" title="Sticky note">📝<small>Note</small></button>
    <button class="ibtn" data-app="timer" title="Add timer">⏱️<small>Timer</small></button>
  </div>

  <div id="shapesPanel" class="popup" hidden>
    <button class="ibtn on" data-sh="select" title="Select / move">⬚<small>Select</small></button>
    <button class="ibtn" data-sh="line" title="Line">╱<small>Line</small></button>
    <button class="ibtn" data-sh="rect" title="Rectangle">▭<small>Rect</small></button>
    <button class="ibtn" data-sh="ellipse" title="Ellipse">⬯<small>Oval</small></button>
    <button class="ibtn" data-sh="arrow" title="Arrow">➶<small>Arrow</small></button>
  </div>

  <div id="moreMenu" class="popup" hidden>
    <div class="mlab">Background</div>
    <div class="bgdots" id="bgDots">
      <button class="bgdot on" data-bg="white" title="White" style="background:#ffffff"></button>
      <button class="bgdot" data-bg="dark" title="Dark" style="background:#20242c"></button>
      <button class="bgdot" data-bg="grid" title="Grid"
        style="background:#fff;background-image:linear-gradient(#dfe3ec 1px,transparent 1px),linear-gradient(90deg,#dfe3ec 1px,transparent 1px);background-size:12px 12px"></button>
      <button class="bgdot" data-bg="dots" title="Dotted"
        style="background:#fff;background-image:radial-gradient(#c3cad6 1.6px,transparent 1.6px);background-size:12px 12px"></button>
    </div>
    <div class="msep"></div>
    <button class="mi" id="mExport">⤵&nbsp; Export board as PNG</button>
    <button class="mi danger" id="mClear">🗑&nbsp; Clear this page</button>
  </div>

  <div id="pagesPanel" class="popup" hidden></div>

  <!-- image search drawer -->
  <div id="imgDrawer">
    <div class="dhead"><b>🖼️ Stock images</b><button class="ibtn" id="imgClose" title="Close">✕</button></div>
    <div id="imgSearch">
      <input id="imgQ" placeholder="Search images…" enterkeyhint="search" />
      <button id="imgGo">Search</button>
    </div>
    <div id="imgResults"><div class="dmsg">Search Wikimedia Commons —<br>millions of free classroom images.<br><br>Tap an image to add it to the board.</div></div>
    <div id="imgNote">Images: Wikimedia Commons (open licenses). License shown under each result. Tap to insert.</div>
  </div>

  <div id="timers"></div>
  <textarea id="textEdit" hidden></textarea>
  <input type="file" id="filePick" accept="image/*" multiple hidden />
  <div id="status"></div>
</div>

<script>
"use strict";
/* ============================================================
   Whiteboard — SMART Board-style classroom whiteboard
   Single canvas, object model, pointer events (touch friendly).
   Stock images: Wikimedia Commons API (keyless, CORS-safe).
   ============================================================ */
const stage = document.getElementById('stage');
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let dpr = 1, W = 0, H = 0;
function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  render();
}
new ResizeObserver(resize).observe(stage);

/* ---------------- state ---------------- */
let strokes = [];      // ink + shapes: {kind, ...}
let objects = [];      // images / text / notes: {id, kind, x,y,w,h, ...}
let bg = 'white';
const imgCache = new Map();   // id -> HTMLImageElement
let objSeq = 1;

let pages = [{ strokes: [], objects: [], bg: 'white' }];
let pageIdx = 0;

/* tools: pen | brush | high | eraser | select | shape | text | note */
let tool = 'pen';
let penKind = 'pen';           // pen | brush | high | eraser  (palette)
let inkColor = '#17202e';
let thickIdx = 1;              // 0 thin, 1 medium, 2 thick
let shapeKind = 'select';      // select | line | rect | ellipse | arrow
let textSize = 40;

const THICK = { pen: [3, 6, 12], brush: [7, 11, 17], high: [9, 15, 22], eraser: [20, 32, 52] };
const NOTE_COLORS = ['#ffe58a', '#ffc7d6', '#bfe0ff', '#c9f0c9'];
let noteColor = NOTE_COLORS[0];

/* ---------------- history (undo/redo) ---------------- */
let hist = [], hIdx = -1;
function snap() {
  // Deep-copy everything: history entries must not alias live objects,
  // or later drags/edits would corrupt undo. Images live in imgCache
  // and are re-attached by imgId in applySnap.
  const cleanObj = o => {
    const c = {};
    for (const k of Object.keys(o)) {
      if (k === 'img' || k === '_lines' || k === '_ui') continue;
      c[k] = o[k];
    }
    return JSON.parse(JSON.stringify(c));
  };
  return { page: pageIdx,
    strokes: JSON.parse(JSON.stringify(strokes)),
    objects: objects.map(cleanObj) };
}
function pushHist() {
  hist = hist.slice(0, hIdx + 1);
  hist.push(snap());
  if (hist.length > 80) hist.shift();
  hIdx = hist.length - 1;
  syncHistBtns();
}
function applySnap(s) {
  pageIdx = s.page;
  strokes = JSON.parse(JSON.stringify(s.strokes));
  objects = s.objects.map(o => ({ ...o, img: o.imgId ? imgCache.get(o.imgId) : undefined }));
  selection = null;
  render(); renderPagesPanel(); syncHistBtns();
}
function undo() { if (hIdx > 0) { hIdx--; applySnap(hist[hIdx]); } }
function redo() { if (hIdx < hist.length - 1) { hIdx++; applySnap(hist[hIdx]); } }
function syncHistBtns() {
  document.getElementById('undoBtn').disabled = hIdx <= 0;
  document.getElementById('redoBtn').disabled = hIdx >= hist.length - 1;
}

/* ---------------- pages ---------------- */
function savePage() { pages[pageIdx] = { strokes, objects, bg }; }
function loadPage(i) {
  savePage();
  pageIdx = i;
  const p = pages[i];
  strokes = p.strokes; objects = p.objects; bg = p.bg;
  selection = null;
  render(); renderPagesPanel(); syncBgDots();
}
function addPage() {
  savePage();
  pages.push({ strokes: [], objects: [], bg: 'white' });
  pageIdx = pages.length - 1;
  strokes = []; objects = []; bg = 'white'; selection = null;
  pushHist(); render(); renderPagesPanel(); syncBgDots();
  status('Page ' + pages.length + ' added');
}
function renderPagesPanel() {
  const el = document.getElementById('pagesPanel');
  el.innerHTML = '';
  pages.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'pg' + (i === pageIdx ? ' on' : '');
    const label = document.createElement('span');
    label.textContent = 'Page ' + (i + 1) + '  (' + (p.strokes.length + p.objects.length) + ' items)';
    b.appendChild(label);
    if (pages.length > 1) {
      const del = document.createElement('span');
      del.className = 'del'; del.textContent = '✕'; del.title = 'Delete page';
      del.addEventListener('pointerdown', e => e.stopPropagation());
      del.addEventListener('click', e => {
        e.stopPropagation();
        pages.splice(i, 1);
        if (pageIdx >= pages.length) pageIdx = pages.length - 1;
        const p2 = pages[pageIdx];

  });
  try {
    const r = await fetch(WIKI + '?' + params.toString());
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    const pages = d.query && d.query.pages ? Object.values(d.query.pages) : [];
    const items = [];
    for (const p of pages) {
      const ii = p.imageinfo && p.imageinfo[0];
      if (!ii || !ii.thumburl || !ii.url) continue;
      const em = ii.extmetadata || {};
      const lic = stripHtml(em.LicenseShortName && em.LicenseShortName.value);
      if (!lic || /copyrighted|all rights reserved/i.test(lic)) continue;
      items.push({
        title: p.title.replace(/^File:/, '').replace(/\.[a-z]+$/i, '').replace(/_/g, ' '),
        thumb: ii.thumburl, full: ii.url, w: ii.width, h: ii.height,
        lic, artist: stripHtml(em.Artist && em.Artist.value)
      });
    }
    if (!items.length) {
      imgResults.innerHTML = '<div class="dmsg">No openly-licensed images found.<br>Try another search.</div>';
      return;
    }
    imgResults.innerHTML = '';
    for (const it of items) {
      const card = document.createElement('div');
      card.className = 'ires';
      card.innerHTML = '<img loading="lazy" alt=""><div class="cap"><div class="t"></div><div class="lic"></div></div>';
      card.querySelector('img').src = it.thumb;
      card.querySelector('.t').textContent = it.title;
      card.querySelector('.lic').textContent = '© ' + it.lic + (it.artist ? ' · ' + it.artist : '');
      card.title = 'Tap to add to the board';
      card.addEventListener('click', () => insertImage(it.full, it.title, it.lic));
      imgResults.appendChild(card);
    }
  } catch (err) {
    imgResults.innerHTML = '<div class="dmsg">Search failed — check connection<br>and try again.</div>';
  }
}
document.getElementById('imgGo').addEventListener('click', searchImages);
imgQ.addEventListener('keydown', e => { if (e.key === 'Enter') searchImages(); });

function insertImage(src, title, lic) {
  status('Loading image…');
  const img = new Image();
  if (!src.startsWith('data:')) img.crossOrigin = 'anonymous';
  img.onload = () => {
    const maxDim = 520;
    const sc = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(60, Math.round(img.naturalWidth * sc));
    const h = Math.max(60, Math.round(img.naturalHeight * sc));
    const id = 'img' + (objSeq++);
    imgCache.set(id, img);
    const o = { id, kind: 'img', imgId: id, img, x: Math.round(W / 2 - w / 2), y: Math.round(H / 2 - h / 2),
                w, h, title: title || 'image', license: lic || '', _ar: w / h };
    objects.push(o);
    selection = o;
    setTool('select');
    drawer.classList.remove('open');
    pushHist(); render();
    status('Image added — drag to move, corner to resize');
  };
  img.onerror = () => status('Could not load that image');
  img.src = src;
}

/* upload from device + drag & drop */
const filePick = document.getElementById('filePick');
document.getElementById('uploadBtn').addEventListener('click', () => { hidePopups(); filePick.click(); });
filePick.addEventListener('change', () => {
  for (const f of filePick.files) if (f.type.startsWith('image/')) readFileImage(f);
  filePick.value = '';
});
function readFileImage(f) {
  const r = new FileReader();
  r.onload = () => insertImage(r.result, f.name.replace(/\.[a-z]+$/i, ''), '');
  r.readAsDataURL(f);
}
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('dragover'); });
stage.addEventListener('dragleave', () => stage.classList.remove('dragover'));
stage.addEventListener('drop', e => {
  e.preventDefault(); stage.classList.remove('dragover');
  for (const f of e.dataTransfer.files) if (f.type.startsWith('image/')) readFileImage(f);
});

/* ---------------- timers ---------------- */
let timerN = 0;
let AC = null;
function chime() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    [[880, 0], [1174.66, 0.28], [880, 0.56]].forEach(([f, dt]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + dt + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.26);
      o.connect(g); g.connect(AC.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.3);
    });
  } catch (err) { /* audio unavailable */ }
}
function fmt(s) {
  s = Math.max(0, Math.ceil(s));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function addTimer() {
  timerN++;
  const el = document.createElement('div');
  el.className = 'timer';
  const ox = 70 + (timerN % 5) * 44, oy = 90 + (timerN % 5) * 44;
  el.style.left = Math.min(ox, Math.max(8, W - 244)) + 'px';
  el.style.top = oy + 'px';
  el.innerHTML =
    '<div class="thead"><span class="tt">⏱ Timer ' + timerN + '</span><span class="tx">✕</span></div>' +
    '<div class="tbody"><div class="tdisp">01:00</div><div class="tbar"><i style="width:100%"></i></div>' +
    '<div class="chips">' +
      [1, 2, 5, 10].map(m => '<button class="chip" data-m="' + m + '">' + m + '</button>').join('') +
    '</div>' +
    '<div class="tcustom"><input type="number" min="1" max="180" placeholder="Min" /><button>Set</button></div>' +
    '<div class="tbtns"><button class="tstart">Start</button><button class="treset">Reset</button></div></div>';
  document.getElementById('timers').appendChild(el);
  const st = { total: 60, left: 60, running: false, id: null };
  const disp = el.querySelector('.tdisp'), bar = el.querySelector('.tbar i'),
        startB = el.querySelector('.tstart');
  function paint() {
    disp.textContent = fmt(st.left);
    bar.style.width = (st.total ? (st.left / st.total) * 100 : 0) + '%';
    startB.textContent = st.running ? 'Pause' : 'Start';
  }
  function stop() { st.running = false; clearInterval(st.id); st.id = null; paint(); }
  function finish() {
    stop(); st.left = 0; paint();
    el.classList.remove('done'); void el.offsetWidth; el.classList.add('done');
    chime();
  }
  startB.addEventListener('click', () => {
    if (st.running) { stop(); return; }
    if (st.left <= 0) st.left = st.total;
    el.classList.remove('done');
    st.running = true;
    const endAt = Date.now() + st.left * 1000;
    st.id = setInterval(() => {
      st.left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (st.left <= 0) finish(); else paint();
    }, 200);
    paint();
  });
  el.querySelector('.treset').addEventListener('click', () => {
    stop(); st.left = st.total; el.classList.remove('done'); paint();
  });
  el.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
    stop(); st.total = st.left = (+ch.dataset.m) * 60; el.classList.remove('done'); paint();
  }));
  const cin = el.querySelector('.tcustom input');
  el.querySelector('.tcustom button').addEventListener('click', () => {
    const m = Math.min(180, Math.max(1, +cin.value || 0));
    if (!m) return;
    stop(); st.total = st.left = m * 60; el.classList.remove('done'); paint();
  });
  el.querySelector('.tx').addEventListener('click', () => { stop(); el.remove(); });
  // drag by header
  const head = el.querySelector('.thead');
  head.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('tx')) return;
    e.preventDefault();
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
    head.setPointerCapture(e.pointerId);
    const mv = ev => {
      el.style.left = Math.min(Math.max(0, ev.clientX - sx), W - 60) + 'px';
      el.style.top = Math.min(Math.max(0, ev.clientY - sy), H - 60) + 'px';
    };
    const up = () => { head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); };
    head.addEventListener('pointermove', mv);
    head.addEventListener('pointerup', up);
  });
  paint();
  status('Timer added — drag it anywhere');
}

/* ---------------- export PNG ---------------- */
function exportPNG() {
  const S = 2;
  const c = document.createElement('canvas');
  c.width = W * S; c.height = H * S;
  const g = c.getContext('2d');
  g.setTransform(S, 0, 0, S, 0, 0);
  drawBG(g, W, H);
  for (const s of strokes) drawStroke(g, s);
  for (const o of objects) drawObject(g, o);
  c.toBlob(b => {
    if (!b) { status('Export failed'); return; }
    const a = document.createElement('a');
    const t = (document.getElementById('boardTitle').value || 'whiteboard').trim() || 'whiteboard';
    a.href = URL.createObjectURL(b);
    a.download = t.replace(/[^\w\- ]+/g, '').slice(0, 60) + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    status('Board exported as PNG');
  }, 'image/png');
}

/* ---------------- init ---------------- */
resize();
syncToolUI();
syncBgDots();
renderPagesPanel();
pushHist();
status('Pick a pen and draw — tap △ for shapes, ⊞ for text & timers');

<button id="bgm-btn" aria-label="Play background music" title="Lofi deep house mix">&#9834;</button>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {
  var btn = document.getElementById("bgm-btn");
  var frame = document.getElementById("bgm-frame");
  var NOTE = "&#9834;", PAUSE = "&#10074;&#10074;";
  var widget = null, ready = false;
  function setIcon(playing) {
    btn.innerHTML = playing ? PAUSE : NOTE;
    btn.classList.toggle("playing", playing);
    btn.setAttribute("aria-label", playing ? "Pause background music" : "Play background music");
  }
  function init() {
    if (typeof SC === "undefined" || !SC.Widget) return;
    try { widget = SC.Widget(frame); } catch (e) { return; }
    widget.bind(SC.Widget.Events.READY, function () {
      ready = true;
      widget.bind(SC.Widget.Events.PLAY, function () { setIcon(true); });
      widget.bind(SC.Widget.Events.PAUSE, function () { setIcon(false); });
    });
  }
  btn.addEventListener("click", function () {
    if (!ready || !widget) return;
    try { widget.toggle(); } catch (e) {}
  });
  if (document.readyState === "complete") init();
  else window.addEventListener("load", init);
})();
</script>
