<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello Morse — Interactive Quiz</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f6f8fc; color: #17202e; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 20px; background: #ffffff; border-bottom: 1px solid #e6e9f0; }
  .topbar a.back { color: #2b6bff; text-decoration: none; font-weight: 600; white-space: nowrap; }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frame-wrap { flex: 1; min-height: 0; padding: 16px; }
  iframe { width: 100%; height: 100%; border: 1px solid #e6e9f0; border-radius: 12px; background: #fff; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../../">&larr; All lessons</a>
  <h1>&#x1F50E; Hello Morse &mdash; Interactive Quiz</h1>
</div>
<div class="frame-wrap">
  <iframe src="https://docs.google.com/presentation/d/1RYRRo-mccdg5bhVvZw306asVWe-r4nnBlAVEM9OvdXc/embed?start=false&loop=false"
          allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"
          title="Hello Morse quiz slides"></iframe>
</div>
<!-- background music: lofi deep house mix (SoundCloud) -->
<style>
  #bgm-btn { position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    width: 56px; height: 56px; border-radius: 999px; border: 0; cursor: pointer;
    background: #2b6bff; color: #fff; font-size: 24px; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(43,107,255,.35);
    transition: transform .15s, background .15s; font-family: inherit; }
  #bgm-btn:hover { background: #1f58e0; transform: scale(1.06); }
  #bgm-btn.playing { animation: bgm-pulse 1.6s ease-in-out infinite; }
  @keyframes bgm-pulse {
    0%,100% { box-shadow: 0 8px 24px rgba(43,107,255,.35); }
    50%     { box-shadow: 0 8px 34px rgba(43,107,255,.70); } }
  #bgm-frame { position: absolute; width: 1px; height: 1px;
    left: -9999px; top: -9999px; border: 0; visibility: hidden; }
</style>
<iframe id="bgm-frame" title="Background music" allow="autoplay" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fkrisandgreta%2Flofi-deep-house-music-mix-cozy-work-study-session-greta&amp;color=%232b6bff&amp;auto_play=false&amp;hide_related=true&amp;show_comments=false&amp;show_user=false&amp;show_reposts=false&amp;show_teaser=false&amp;visual=false"></iframe>
<button id="bgm-btn" aria-label="Play background music" title="Lofi deep house mix">&#9834;</button>
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
(function () {
  var btn = document.getElementById("bgm-btn");
  var frame = document.getElementById("bgm-frame");
  var NOTE = "&#9834;", PAUSE = "&#10074;&#10074;";
  var widget = null, ready = false;
  function setIcon(playing) {
    btn.innerHTML = playing ? PAUSE : NOTE;
    btn.classList.toggle("playing", playing);
    btn.setAttribute("aria-label", playing ? "Pause background music" : "Play background music");
  }
  function init() {
    if (typeof SC === "undefined" || !SC.Widget) return;
    try { widget = SC.Widget(frame); } catch (e) { return; }
    widget.bind(SC.Widget.Events.READY, function () {
      ready = true;
      widget.bind(SC.Widget.Events.PLAY, function () { setIcon(true); });
      widget.bind(SC.Widget.Events.PAUSE, function () { setIcon(false); });
    });
  }
  btn.addEventListener("click", function () {
    if (!ready || !widget) return;
    try { widget.toggle(); } catch (e) {}
  });
  if (document.readyState === "complete") init();
  else window.addEventListener("load", init);
})();
</script>
</body>
</html>
